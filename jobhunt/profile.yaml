# One resume "track" per kind of role. Tailoring picks the closest track, then adapts it.
tracks:
  backend:
    label: Backend
    headline: Software Engineer | Backend Systems (Node.js, NestJS, Rust) | AI Engineering
    summary: Software engineer with {experience} of experience building Node.js, NestJS and Rust (Axum) backends, REST APIs and PostgreSQL/MongoDB data models on GCP and AWS. Led the DEYE India platform from plan to production in one week and built LLM features, including a RAG assistant.
    skill_order: [Backend, Languages, Databases, Cloud & DevOps, AI Engineering, Frontend & Mobile]
    projects: [fji, geopunch, elt]
    title_pattern: "backend|back-end|node|nest|api|platform|server|sde|software engineer|software developer"
  fullstack:
    label: Full Stack
    headline: Full Stack Engineer | Next.js, React Native, Node.js | AI Engineering
    summary: Full stack engineer with {experience} of experience shipping Next.js, React Native and Node.js products on Supabase, GCP and AWS, from client CRMs and a payroll SaaS to the DEYE India platform, taken live on three environments in one week.
    skill_order: [Frontend & Mobile, Backend, Languages, Databases, Cloud & DevOps, AI Engineering]
    projects: [fji, geopunch, elt]
    title_pattern: "full[ -]?stack|fullstack|mern|product engineer|web developer|forward deployed|software engineer|sde"
  ai:
    label: AI Engineer
    headline: AI Engineer | RAG, LLM Applications, Evals | Backend Systems
