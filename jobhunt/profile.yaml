# One resume "track" per kind of role. Tailoring picks the closest track, then adapts it.
tracks:
  backend:
    label: Backend
    headline: Software Engineer | Backend Systems | AI Engineering
    summary: Software engineer with {experience} of experience building Node.js and NestJS backends, REST APIs and PostgreSQL data models on AWS and GCP. Shipped two products end to end and built an LLM data pipeline with measured accuracy and cost.
    skill_order: [Backend, Languages, Databases, Cloud & DevOps, AI Engineering, Frontend & Mobile]
    projects: [fji, crm, elt, fasal]
    title_pattern: "backend|back-end|node|nest|api|platform|server|sde|software engineer|software developer"
  fullstack:
    label: Full Stack
    headline: Full Stack Engineer | Next.js, NestJS, Node.js | AI Engineering
    summary: Full stack engineer with {experience} of experience shipping Next.js, React Native and NestJS products on Supabase, AWS and GCP, including two products built end to end. Also builds LLM features and pipelines with measured accuracy and cost.
